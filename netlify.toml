[build]
  publish = "."

# Pyodide télécharge ~10 Mo au premier lancement : on autorise le cache long
# sur les données, court sur l'app elle-même (pour que vos mises à jour sortent vite).
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sessions chronométrées : une fonction serveur, jamais mise en cache
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Carnets : notebooks des cours convertis en pages, non référencés (23 octobre 2026).
# Ni portail ni menu n'y mène ; les moteurs de recherche ne les indexent pas.
[[headers]]
  for = "/carnets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
