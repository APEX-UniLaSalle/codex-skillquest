<script type="application/json" id="cDonnees">{"nom": "optimisation-sac-a-dos", "cellules": [{"type": "md", "source": "# **Les problème du sac à dos**\n\nVoici un exercice qui vous permettra de vous exercer sur la pratique d'optimisation.\n\nLe problème du sac à dos est un des 21 problèmes NP-Complet, qui sont les plus difficiles en optimisation combinatoire.\n\nSon énoncé est simple : \"Étant donné plusieurs objets possédant chacun un poids et une valeur et étant donné un poids maximum pour le sac, quels objets faut-il mettre dans le sac de manière à maximiser la valeur totale sans dépasser le poids maximal autorisé pour le sac ?\".\n\nNous disposons des paramètres suivants :\n- poids, la liste des poids des objets disponibles\n- valeurs, la liste des valeurs des objets disponibles, classées dans le même ordre que poids\n- capacite, le poids maximal autorisé pour le sac"}, {"type": "code", "source": "poids = [1,5,3,2,4] \nvaleurs = [10,50,20,30,60]\ncapacite = 11", "sorties": [], "correction": false}, {"type": "md", "source": "1. **Solution gloutonne**\n\nUne solution efficace consiste à déterminer quels objets placer en priorité dans le sac, en fonction de leur rapport valeur/poids. On trie les objets suivant ce rapport, en ordre décroissant, et on ajoute au sac les éléments positionnés en premiers dans cette liste."}, {"type": "code", "source": "def tri(l):\n  \"\"\"\n  Tri l en ordre décroissant suivant le valeur contenue dans le 4ème élément (rapport valeur/poids)\n  \"\"\"\n  for i in range(len(l)):\n    rapport1 = l[i][3]\n    x = l[i]\n    j = i\n    rapport2 = l[j-1][3]\n    while j > 0 and rapport2<rapport1 :\n      l[j] = l[j-1]\n      j-=1\n    l[j] = x\n  return l\n\ndef sac_a_dos_glouton(poids, valeurs, capacite): \n  \"\"\"\n  Retourne la solution gloutonne au problème du sac à dos\n  \"\"\"\n  l = []\n  for i in range(len(poids)): \n    l.append([i,poids[i],valeurs[i],valeurs[i]/poids[i]])\n  l = tri(l)\n  cpt = 0\n  for i in l:\n    poidsCourant = i[1] \n    valeurCourante = i[2] \n    if capacite - poidsCourant >= 0: \n      capacite -= poidsCourant \n      cpt += valeurCourante\n  return cpt \n\nprint('La valeur maximale pouvant être contenue dans le sac à dos est de :',sac_a_dos_glouton(poids, valeurs, capacite))", "sorties": [{"genre": "stdout", "donnee": "La valeur maximale pouvant être contenue dans le sac à dos est de : 120\n"}], "correction": false}, {"type": "md", "source": "Cette solution est rapide, mais ne fonctionne pas sur toutes les entrées. Dans ce cas précis, nous avons sélectionné les objets suivants :"}, {"type": "code", "source": "def sac_a_dos_glouton(poids, valeurs, capacite): \n  \"\"\"\n  Retourne la solution gloutonne au problème du sac à dos\n  \"\"\"\n  l = []\n  for i in range(len(poids)): \n    l.append([i,poids[i],valeurs[i],valeurs[i]/poids[i]])\n  print('Liste des objets et rapport valeur/poids',l)\n  l = tri(l)\n  cpt = 0\n  for i in l:\n    poidsCourant = i[1] \n    valeurCourante = i[2] \n    if capacite - poidsCourant >= 0: \n      capacite -= poidsCourant \n      cpt += valeurCourante\n      print(\"Ajout de l'objet\",i[0],'de valeur',i[1],'et de poids',i[2])\n  return cpt \n\nprint('La valeur maximale pouvant être contenue dans le sac à dos est de :',sac_a_dos_glouton(poids, valeurs, capacite))", "sorties": [{"genre": "stdout", "donnee": "Liste des objets et rapport valeur/poids [[0, 1, 10, 10.0], [1, 5, 50, 10.0], [2, 3, 20, 6.666666666666667], [3, 2, 30, 15.0], [4, 4, 60, 15.0]]\nAjout de l'objet 4 de valeur 4 et de poids 60\nAjout de l'objet 3 de valeur 2 et de poids 30\nAjout de l'objet 0 de valeur 1 et de poids 10\nAjout de l'objet 2 de valeur 3 et de poids 20\nLa valeur maximale pouvant être contenue dans le sac à dos est de : 120\n"}], "correction": false}, {"type": "md", "source": "Une meilleure solution consiste à sélectionner les objets d'indice 1, 3 et 4, dont le poids est de 5 + 2 + 4 = 11 et la valeur est de 50 + 30 + 60 = 140.\n\n2. **Solution optimale**\n\nPlusieurs algorithmes permettent d'obtenir la solution optimale, mais ceux-ci demandent un temps de calcul souvent beaucoup plus long.\n\nUne solution célèbre est l'algorithme **branch and bound** qui applique une sorte de résolution par force brute, mais en ne sélectionnant que les combinaisons qui sont potentiellement de bonne qualité et en n'explorant pas les pistes qui ne peuvent pas conduire à améliorer la solution courante.\n\nUne autre solution est d'utiliser la **programmation dynamique**, en décomposant le problème en sous-problèmes et en faisant appel à de la récursivité. On essaie de résoudre le problème seulement sur ses i premiers objets à partir de la solution optimale obtenue sur les i-1 premiers objets. Pour chaque i, on décide de l'ajouter au sac à dos ou non.\n\nUtilisons un module qui permet de résoudre le problème du cas à dos en programmation dynamique."}, {"type": "code", "source": "import knapsack", "sorties": [], "correction": false}, {"type": "md", "source": "En cas d'erreur sur ce bloc d'instructions, lancez l'installation des modules matplotlib et networkx, redémarrez le noyau, puis re-exécutez la dernière cellule de code."}, {"type": "md", "source": "Résolvons maintenant le problème :"}, {"type": "code", "source": "print(knapsack.knapsack(poids,valeurs).solve(capacite))", "sorties": [{"genre": "stdout", "donnee": "(140, [1, 3, 4])\n"}], "correction": false}]}</script>
