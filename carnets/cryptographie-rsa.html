<script type="application/json" id="cDonnees">{"nom": "cryptographie-rsa", "cellules": [{"type": "md", "source": "# **Algorithme RSA**\n\nDans ce chapitre, nous allons découvrir un exemple de **chiffrement asymétrique**. L'idée est de ne pas utiliser la même clé pour chiffrer et déchiffrer un texte. Nous aurons une clé dite **publique** pour **encoder** le message, et une clé dite **privée** pour le **décoder**.\n\nCette méthode permet de distribuer des clés publiques et que seul le propriétaire de la clé privée soit capable de décoder les messages codés avec la clé publique.\n\nIci, nous allons découvrir le fonctionnement de l'**algorithme** **RSA** (*en référence à ses inventeurs Rivest Shamir et Adleman*).\n\nCet algorithme repose sur un principe mathématique simple mais ingénieux.\n\nA partir de deux **nombres premiers** P et Q, on crée une clé publique N dont la valeur est égale à P x Q.\n\nLa clé privée s'obtient à partir de P et Q.\n\nEn théorie, il est possible de retrouver P et Q à partir de N en le factorisant.\n\nEn pratique, si P et Q sont suffisament grands, aucun ordinateur n'est capable de retrouver les valeurs, le nombre d'opérations nécessaires étant trop élevé pour une résolution par force brute (nombre d'opérations exponentiel en fonction de la taille des facteurs premiers).\n\nL'algorithme RSA est utilisé dans beaucoup de protocoles de sécurité sur internet.\n\nVoici le fonctionnement de l'algorithme RSA. Commençons par choisir des valeurs pour P et Q."}, {"type": "code", "source": "P = 13\nQ = 19", "sorties": [], "correction": false}, {"type": "md", "source": "Calculons N, le produit de P par Q."}, {"type": "code", "source": "N = P*Q\nN", "sorties": [{"genre": "resultat", "donnee": "247"}], "correction": false}, {"type": "md", "source": "Choisissons E un nombre n'ayant pas de facteur commun avec R = (P-1)x(Q-1)."}, {"type": "code", "source": "R = (P-1)*(Q-1)\nR", "sorties": [{"genre": "resultat", "donnee": "216"}], "correction": false}, {"type": "code", "source": "import math\n\ndef decomposition(x):\n  \"\"\"\n  Retourne la décomposition de x en facteurs premiers, sous la forme d'une liste\n  \"\"\"\n  d = []\n  for  i in range(2,int(math.sqrt(x)+1)):\n    while x%i==0:\n      x = int(x/i)\n      d.append(i)\n    if x>1:\n      d.append(x)\n  d=sorted(list(set(d)))\n  return d", "sorties": [], "correction": false}, {"type": "code", "source": "decomposition(R)", "sorties": [{"genre": "resultat", "donnee": "[2, 3, 27]"}], "correction": false}, {"type": "code", "source": "E = 11", "sorties": [], "correction": false}, {"type": "md", "source": "La **clé publique** P est la paire (E,N)"}, {"type": "code", "source": "P = (E,N)\nP", "sorties": [{"genre": "resultat", "donnee": "(11, 247)"}], "correction": false}, {"type": "md", "source": "Choisissons maintenant D telque E x D % R = 1."}, {"type": "code", "source": "i=1\nwhile i*E%R!=1:\n  i+=1\nD=i\nprint(D,'*',E,'%',R,'=',i*E%R)", "sorties": [{"genre": "stdout", "donnee": "59 * 11 % 216 = 1\n"}], "correction": false}, {"type": "md", "source": "Prenons le premier nombre qui remplisse cette condition : 59.\n\nLa **clé privée** Q est la paire (D,N)."}, {"type": "code", "source": "Q = (D,N)\nQ", "sorties": [{"genre": "resultat", "donnee": "(59, 247)"}], "correction": false}, {"type": "md", "source": "Afin d'encode ou de décoder un texte, nous allons avoir besoin de transformer les lettres du texte en nombres et inversement. Nous affecterons la valeur 1 à a, 2 à B, etc.\n\nImportont le module nécessaire."}, {"type": "code", "source": "from string import ascii_lowercase\nprint(ascii_lowercase)", "sorties": [{"genre": "stdout", "donnee": "abcdefghijklmnopqrstuvwxyz\n"}], "correction": false}, {"type": "md", "source": "En cas d'erreur sur ce bloc d'instructions, lancez l'installation du module string, redémarrez le noyau, puis re-exécutez la dernière cellule de code."}, {"type": "md", "source": "Nous allons créer des fonctions permettant de transformer une lettre un nombre M, et inversement."}, {"type": "code", "source": "lower = ascii_lowercase", "sorties": [], "correction": false}, {"type": "code", "source": "def nombre(x):\n  '''\n  Retourne la lettre x sous la forme d'un nombre\n  '''\n  if x in lower:\n    return lower.index(x)+1\n  else:\n    return 0", "sorties": [], "correction": false}, {"type": "code", "source": "def lettre(x):\n  '''\n  Retourne le nombre x sous la forme d'une lettre\n  '''\n  if x>0:\n    return lower[x-1]\n  else:\n    return ' '", "sorties": [], "correction": false}, {"type": "code", "source": "print(nombre('b'))\nprint(nombre('z'))", "sorties": [{"genre": "stdout", "donnee": "2\n26\n"}], "correction": false}, {"type": "code", "source": "print(lettre(2))\nprint(lettre(26))", "sorties": [{"genre": "stdout", "donnee": "b\nz\n"}], "correction": false}, {"type": "md", "source": "Réalisons maintenant la fonction de chiffrement RSA dont le principe est, pour chaque lettre du texte à chiffrer M, de calculer C = M ^ E % N où (E,N) est la clé publique."}, {"type": "code", "source": "def codeRSA(x,cle):\n  '''\n  Retourne x chiffré avec l'algorithme RSA et la clé publique cle\n  '''\n  a = []\n  for i in x:\n    a.append(nombre(i)**cle[0]%cle[1])\n  return a", "sorties": [], "correction": false}, {"type": "code", "source": "C = codeRSA('bonjour',P)\nprint(C)", "sorties": [{"genre": "stdout", "donnee": "[72, 98, 222, 147, 98, 148, 151]\n"}], "correction": false}, {"type": "md", "source": "Pour décoder C, il suffit de calculer S = C ^ D % N où (D,N) est la clé privée."}, {"type": "code", "source": "def decodeRSA(x,cle):\n  '''\n  Retourne x déchiffré avec l'algorithme RSA et la clé privée cle\n  '''\n  a = ''\n  for i in x:\n    a+=lettre(i**cle[0]%cle[1])\n  return a", "sorties": [], "correction": false}, {"type": "code", "source": "S = decodeRSA(C,Q)\nprint(S)", "sorties": [{"genre": "stdout", "donnee": "bonjour\n"}], "correction": false}, {"type": "md", "source": "Cet algorithme de cryptographie repose sur la démonstration mathématique de l'égalité :\n\n\n> (M ^ E % N) ^ D % N = M"}]}</script>
