<script type="application/json" id="cDonnees">{"nom": "classes-introduction", "cellules": [{"type": "md", "source": "# **Les classes**\n\nDans ce chapitre, nous allons voir comment créer et utiliser nos propres classes en Python.\n\nDébutons par la création d'une classe Voiture, constituée d’un constructeur, d’une méthode permettant d'accélérer, et d’une méthode permettant d’afficher une instance"}, {"type": "code", "source": "class Voiture :\n  \"\"\"\n  Classe pour représenter une voiture.\n  \"\"\"\n  \n  def __init__(self, puissance, vitesse) :\n    \"\"\"\n    Creation d'une nouvelle voiture constituée d'une puissance en chevaux fiscaux, et d'une vitesse en km/h.\n    \"\"\"\n    self.puissance = puissance\n    self.vitesse = vitesse\n\n  def accelere(self, x) :\n    \"\"\"\n    Accélere de x km/h.\n    \"\"\"\n    self.vitesse += x\n\n  def __str__(self) :\n    \"\"\"\n    Méthode invoquée lors de l'affichage d'une instance.\n    \"\"\"\n    return 'Voiture : '+str(self.puissance)+' CV - '+str(self.vitesse)+' km/h'", "sorties": [], "correction": false}, {"type": "md", "source": "Nous allons maintennant créer une instance de Voiture et consulter la valeur de ses attributs."}, {"type": "code", "source": "v = Voiture(puissance=6, vitesse=40) # appel à __init__\nprint(v.puissance)\nprint(v.vitesse)\nprint(v) # appel à __str__", "sorties": [{"genre": "stdout", "donnee": "6\n40\nVoiture : 6 CV - 40 km/h\n"}], "correction": false}, {"type": "md", "source": "Il est possible d'utiliser les méthodes définies dans la classe Voiture."}, {"type": "code", "source": "v.accelere(2)\nprint(vs)", "sorties": [{"genre": "stdout", "donnee": "Voiture : 6 CV - 42 km/h\n"}], "correction": false}]}</script>
