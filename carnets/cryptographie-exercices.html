<script type="application/json" id="cDonnees">{"nom": "cryptographie-exercices", "cellules": [{"type": "md", "source": "## **Exercice 1 : Temps de calcul**\n\n**Objectif**\n\nConnaissant le texte d'origine, le même texte chiffré, et l'algorithme de cryptographie utilisé, déterminer le temps nécessaire pour découvrir la clé par force brute.\nVoici les paramètres utiles :\n\n*   La clé à déterminer pèse 128 bits\n*   On estime le nombre d'opérations élémentaires pour chiffrer à 1000\n*   Nous disposons d'un PC équipé d'un processeur capable d'effectuer 110 000 millions d'instructions par seconde (Intel Core i7-8086K, 2018)"}, {"type": "md", "source": "Vous devez trouver 9.8 x 10^22 années.\n\nPour donner un idée, le Big Bang date de 13,7 milliards d'années.\n\nLe calcul peut être réparti sur plusieurs ordinateurs mais ça ne suffirait pas...\n\nQuelle est la durée du calcul pour une clé codée sur 56 bits ? Et si on réparti le calcul sur 1000 PC ?"}, {"type": "md", "source": "Un peu moins de 20 ans, et cela descent à 7.5 jours si on fait travailler 1000 processeurs en parallèle sur la tâche. \n\n## **Exercice 2 : Chiffrement faible**\n\n**Objectif**\n\nUn système de cryptage consiste à faire une rotation du texte d'un certain nombre de caractères (vers la droite), puis à ajouter une valeur (avec modulo) à chacun des caractères.\n\nPar exemple, si on prend la chaîne \"abcz\", on peut faire une rotation d'un caractère vers la droite, et obtenir \"zabc\", puis ajouter 1 à chaque caractère, et obtenir la chaîne cryptée \"abcd\". \n\nVous devez écrire un programme qui, à partir d'un texte original *a* (donné sous la forme d'une liste ne contenant que des lettres minuscules non accentuées) et d'un texte cryptée *b* (donné sous la même forme, et ayant la même taille), permette de retrouver les deux valeurs utilisées pour le cryptage (on garantit l'unicité de la solution).\n\nVoici un exemple :"}, {"type": "code", "source": "a = ['a','b','c','d']\nb = ['h','e','f','g']\n\n# Code à rédiger", "sorties": [], "correction": false}, {"type": "md", "source": "Dans cet exemple, nous devons trouver :"}, {"type": "code", "source": "print('1 4')", "sorties": [{"genre": "stdout", "donnee": "1 4\n"}], "correction": false}, {"type": "md", "source": "En effet, en appliquant une rotation de 1 et une permutation de 4, nous obtenons le texte crypté :"}, {"type": "code", "source": "a = ['a','b','c','d']\na = a[-1:] + a[:-1]\nprint(a)\n\nfor i in range(len(a)):\n  a[i]=str(chr(ord(a[i])+4))\nprint(a)", "sorties": [{"genre": "stdout", "donnee": "['d', 'a', 'b', 'c']\n['h', 'e', 'f', 'g']\n"}], "correction": false}, {"type": "md", "source": "## **Exercice 3 : Permutation alphabétique**\n\n**Objectif**\n\nChiffrez le texte 'vive la cryptographie' avec la clé suivante : 'yruhfwlkdxeajitsvznmcpbgqo' et un chiffrement en permutation alphabétique (a remplacé par y, b remplacé par r, etc.)"}, {"type": "md", "source": "Vous devez obtenir : 'pdpf ay uzqsmtlzyskdf'\n\n## **Exercice 4 : Le chiffre de Vigenère**\n\n**Objectif**\n\nChiffrez le texte 'vive la cryptographie' avec la clé 'python'."}, {"type": "md", "source": "Vous devez obtenir 'kgol yp vymcimzyocwgx'.\n\nRetrouvez maintenant le texte en clair associé au texte 'vn jsbgx puov zvjflirwhv' qui a été chiffré avec la clé 'baguette'."}, {"type": "md", "source": "Vous devez obtenir 'un point pour griffondor !'.\n\nRetrouvez enfin la clé associée au texte 'un point pour griffondor' dont la version chiffrée est 'kh srqgv ficu okkmvivgrz !'."}, {"type": "md", "source": "La réponse est 'quidditch'.\n\n\n## **Conclusion**\n\nLes algorithmes vus dans ce chapitre sont dits **symétriques** parce qu'ils utilisent une seule et même clé pour **chiffer** et pour **déchiffrer**.\n\nLe défaut de cette technique est que la clé doit rester **confidentielle**. Si une autre personne que le correspondant a accès à la clé, il sera capable de lire de texte en clair, et de produire de faux textes chiffrés à destination du correspondant initial.\n\nEn pratique, on crée une **clé unique** pour chaque correspondant différent.\n\nLes algorithmes vus ici sont les plus simples, il en existe de beaucoup plus élaborés.\n\nPar exemple, l'algorithme du **masque jetable** qui reprend le principe du chiffre de Vigenère, mais pour lequel la clé est générée aléatoirement, est forcément d'une taille au moins égale à celle du texte à chiffrer, et n'est pas réutilisable (on génère une nouvelle clé pour chaque texte à chiffrer, même pour un même correspondant).\n\nD'autres algorithmes de chiffrement symétrique sont actuellement utilisés en pratique, comme AES qui est le **standard actuel**. AES (Advanced Encryption Standard) fonctionne avec une clé codée sur 128, 192 ou 256 bits stockée dans une matrice sur laquelle on opère des opérations (rotation, multiplication, opérations logiques) pour chiffrer les messages."}]}</script>
