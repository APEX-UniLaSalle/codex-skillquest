lements)==0:\n         raise Exception(\"La file est vide\")\n    return self.elements[0]\n    \n  def __str__(self):\n    out = str(self.elements[0])\n    for x in self.elements[1:]:\n      out = str(x) + \" -> \" + out\n    out = \"File : \" + out\n    return out", "sorties": [], "correction": false}, {"type": "md", "source": "Ecrivez un programme qui affiche les x premiers nombres de Hamming."}, {"type": "code", "source": "def hamming(n):\n  # A compléter\n\nhamming(2002)", "sorties": [], "correction": false}, {"type": "md", "source": "Notons que cette méthode, même si elle est plus efficace que la méthode par \"force brute\", n'est pas optimale parce que le même nombre peut se retrouver dans plusieurs des 3 files alors qu'une seule suffirait."}]}</script>
