nd le premier choix (indice 0) de chaque étudiant : 0, 0, 0\nOn prend de second choix (indice 1) pour le 1er et le 3ème étudiant, et le premier choix pour le second étudiant : 1, 0, 1\n\nLa liste des combinaisons peut être obtenue en comptant en base 2 :\n\n000\n\n001\n\n010\n\n011\n\n100\n\n101\n\n110\n\n111"}, {"type": "code", "source": "for i in range(2**N):\n  b = format(i,'0'+str(N)+'b')\n  print(b)", "sorties": [{"genre": "stdout", "donnee": "000\n001\n010\n011\n100\n101\n110\n111\n"}], "correction": false}, {"type": "md", "source": "On obtient les combinaisons correspondantes ainsi :"}, {"type": "code", "source": "for i in range(2**N):\n  b = format(i,'0'+str(N)+'b')\n  print((T[0][int(b[0])],T[1][int(b[1])],T[2][int(b[2])]))", "sorties": [{"genre": "stdout", "donnee": "(60, 120, 120)\n(60, 120, 400)\n(60, 340, 120)\n(60, 340, 400)\n(400, 120, 120)\n(400, 120, 400)\n(400, 340, 120)\n(400, 340, 400)\n"}], "correction": false}, {"type": "md", "source": "Nous allons maintenant généraliser pour que cela fonctionne quelque soit la valeur de N :"}, {"type": "code", "source": "c=[]\nfor i in range(2**N):\n  b = format(i,'0'+str(N)+'b')\n  v=[]\n  for j in range(N):\n    v.append(T[j][int(b[j])])\n  print(v)", "sorties": [{"genre": "stdout", "donnee": "[60, 120, 120]\n[60, 120, 400]\n[60, 340, 120]\n[60, 340, 400]\n[400, 120, 120]\n[400, 120, 400]\n[400, 340, 120]\n[400, 340, 400]\n"}], "correction": false}, {"type": "md", "source": "Stockons ces valeurs dans une liste qui contient donc toutes les combinaisons possibles, et trions les combinaisons d'horaires en ordre croissant :"}, {"type": "code", "source": "c=[]\nfor i in range(2**N):\n  b = format(i,'0'+str(N)+'b')\n  v=[]\n  for j in range(N):\n    v.append(T[j][int(b[j])])\n  c.append(sorted(v))\nprint(c)", "sorties": [{"genre": "stdout", "donnee": "[[60, 120, 120], [60, 120, 400], [60, 120, 340], [60, 340, 400], [120, 120, 400], [120, 400, 400], [120, 340, 400], [340, 400, 400]]\n"}], "correction": false}, {"type": "md", "source": "Il ne nous reste plus qu'à rechercher le nombre de rendez-vous que peut honorer le professeur pour chaque combinaison, et à retenir la plus grande valeur :"}, {"type": "code", "source": "max=1\nfor i in range(len(c)):\n  maxi = 1\n  debut=c[i][0]\n  for j in range(N):\n    if debut+60<c[i][j]:\n      maxi+=1\n      debut=c[i][j]\n  if maxi>max:\n    max=maxi\nprint(max)", "sorties": [{"genre": "stdout", "donnee": "2\n"}], "correction": false}]}</script>
